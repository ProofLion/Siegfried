[project]
name = "siegfried"
version = "0.1.0"
description = "CSCI 4622 SHIRT trajectory prediction project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "pillow>=11,<14",
    "scikit-image>=0.25,<0.27",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
